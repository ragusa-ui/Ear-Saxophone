name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      print_screenshot:
        description: "Print the UI screenshot as base64 into the log (for review without downloading the artifact)"
        type: boolean
        default: false

jobs:
  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/EarSaxophone.Core.Tests -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build EarSaxophone.sln -c Release
      - name: Test
        run: dotnet test EarSaxophone.sln -c Release --no-build
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/EarSaxophone.App -c Release -r win-x64 --self-contained true -o artifacts/publish
      - name: Verify self-contained output
        shell: pwsh
        run: |
          foreach ($f in 'EarSaxophone.exe', 'coreclr.dll', 'hostpolicy.dll', 'PresentationFramework.dll') {
            if (-not (Test-Path "artifacts/publish/$f")) { throw "Missing $f in publish output" }
          }
          Get-ChildItem artifacts/publish | Measure-Object -Property Length -Sum | ForEach-Object { "Files: $($_.Count), Size: $([math]::Round($_.Sum / 1MB, 1)) MB" }
      - name: Start the published app and render its window to PNG
        shell: pwsh
        run: |
          # Approximate a PC without .NET: hide dotnet from PATH/DOTNET_ROOT (the runner has it installed).
          $env:DOTNET_ROOT = $null
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'dotnet' }) -join ';'
          $png = Join-Path $PWD 'artifacts/ui-screenshot.png'
          $exe = Join-Path $PWD 'artifacts/publish/EarSaxophone.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--demo-screenshot', "`"$png`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'The app did not finish within 90 s' }
          Write-Host "Exit code: $($p.ExitCode)"
          if (Test-Path "$png.error.txt") { Get-Content "$png.error.txt" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw 'UI screenshot failed' }
          Write-Host "PNG size: $((Get-Item $png).Length) bytes"
      - name: Start in normal mode (tray, single instance)
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = $null
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'dotnet' }) -join ';'
          $exe = Join-Path $PWD 'artifacts/publish/EarSaxophone.exe'
          $first = Start-Process -FilePath $exe -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 8
          if ($first.HasExited) { throw "First instance exited early with code $($first.ExitCode)" }
          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(30000)) { $second.Kill(); $first.Kill(); throw 'Second instance did not exit (single instance not working)' }
          Write-Host "Second instance exit code: $($second.ExitCode)"
          Start-Sleep -Seconds 3
          if ($first.HasExited) { throw 'First instance died after the second one was started' }
          $first.Kill()
          $log = Join-Path $PWD 'artifacts/publish/error.log'
          if (Test-Path $log) { Get-Content $log; throw 'error.log was written during normal start' }
          Write-Host 'Normal mode: first instance stayed running (tray), second instance exited, no error.log'
      - name: Update script (Windows PowerShell 5.1, test installation)
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/updatetest'
          $install = Join-Path $root 'install'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          Copy-Item artifacts/publish/* $install -Recurse
          foreach ($f in 'Update.ps1', 'Update.cmd', 'EarSaxophone.exe') { if (-not (Test-Path (Join-Path $install $f))) { throw "Missing $f in publish output" } }
          Set-Content (Join-Path $install 'profiles.json') 'KEEP-ME'
          Set-Content (Join-Path $install 'settings.json') 'KEEP-ME-TOO'
          $newName = 'EarSaxophone-9.9.9-win-x64'
          $stage = Join-Path $root $newName
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item artifacts/publish/* $stage -Recurse
          Set-Content (Join-Path $stage 'NEW-FILE.txt') 'new'
          Set-Content (Join-Path $stage 'profiles.json') 'FROM-ZIP-MUST-NOT-OVERWRITE'
          $zip = Join-Path $root "$newName.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          # 1. wrong checksum: must fail and change nothing
          "0000$hash  x.zip" | Set-Content "$zip.sha256" -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $install 'Update.ps1') -Zip $zip -NoStart -NoPause
          if ($LASTEXITCODE -ne 1) { throw "Wrong checksum should exit with 1, got $LASTEXITCODE" }
          if (Test-Path (Join-Path $install 'NEW-FILE.txt')) { throw 'Files were copied despite a wrong checksum' }

          # 2. correct checksum: update, user files stay
          "$hash  $newName.zip" | Set-Content "$zip.sha256" -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $install 'Update.ps1') -Zip $zip -NoStart -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Update failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $install 'NEW-FILE.txt'))) { throw 'New file was not copied' }
          if ((Get-Content (Join-Path $install 'profiles.json') -Raw).Trim() -ne 'KEEP-ME') { throw 'profiles.json was changed' }
          if ((Get-Content (Join-Path $install 'settings.json') -Raw).Trim() -ne 'KEEP-ME-TOO') { throw 'settings.json was changed' }

          # 3. not a release zip: clear error
          Set-Content (Join-Path $root 'other.txt') 'x'
          Compress-Archive -Path (Join-Path $root 'other.txt') -DestinationPath (Join-Path $root 'other.zip')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $install 'Update.ps1') -Zip (Join-Path $root 'other.zip') -NoStart -NoPause
          if ($LASTEXITCODE -ne 1) { throw "A zip without EarSaxophone.exe should fail with 1, got $LASTEXITCODE" }
          Write-Host 'Update script: wrong checksum rejected, update applied, profiles and settings kept, foreign zip rejected'
          $global:LASTEXITCODE = 0   # the last native call failed on purpose; do not let it fail this step
      - name: Print screenshot as base64 JPEG
        if: ${{ github.event.inputs.print_screenshot == 'true' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile("$PWD/artifacts/ui-screenshot.png")
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $params = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, 85L)
          $img.Save("$PWD/artifacts/ui-screenshot.jpg", $codec, $params)
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/artifacts/ui-screenshot.jpg"))
          Write-Host "SCREENSHOT-BEGIN"
          for ($i = 0; $i -lt $b64.Length; $i += 3000) { Write-Host $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
          Write-Host "SCREENSHOT-END"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/EarSaxophone-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EarSaxophone-win-x64
          path: artifacts/EarSaxophone-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EarSaxophone-ui-screenshot
          path: artifacts/ui-screenshot.png
          if-no-files-found: error
      - name: UI report (text description of the rendered window)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ui-screenshot.png.report.txt) { Get-Content artifacts/ui-screenshot.png.report.txt -Encoding UTF8 } else { Write-Host 'no report' }
